name: Update dashboard

# Fires on every LeetSync push, once a day as a safety net, or on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so each problem folder can be dated

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
        run: python scripts/generate_readme.py

      - name: Generate site data
        run: python scripts/generate_site.py

      - name: Notify Discord of new solves
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py

      - name: Commit generated files
        run: |
          set -e
          git config user.name "leet-collection-bot"
          git config user.email "actions@users.noreply.github.com"
          # Only stage files that actually exist — .leet-notified.json is only
          # created once DISCORD_WEBHOOK_URL is set, so an explicit `git add`
          # on it before then would fail with "did not match any files".
          files="README.md docs/data.json .leet-meta-cache.json"
          for f in .leet-notified.json; do
            [ -f "$f" ] && files="$files $f"
          done
          git add $files
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
            exit 0
          else
            git commit -m "docs: auto-update dashboard [skip ci]"
          fi

          # LeetSync may push a new solve while this job is running.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) - fetching and rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict - leaving it for the next run instead of forcing."
              git rebase --abort
              exit 0
            fi
          done
          echo "::error::Failed to push generated files after 5 attempts."
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

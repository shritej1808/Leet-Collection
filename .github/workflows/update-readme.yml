name: Update README dashboard

# Runs every time LeetSync (or you) push a new solution, plus a daily
# safety-net run in case LeetCode's problem metadata changes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: readme-update
  cancel-in-progress: true

jobs:
  build-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can date each problem folder

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate README
        env:
          LEETCODE_USERNAME: ${{ vars.LEETCODE_USERNAME }}
        run: python scripts/generate_readme.py

      - name: Generate site data
        run: python scripts/generate_site.py

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/notify_discord.py

      - name: Commit updated dashboard
        run: |
          git config user.name "leet-collection-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md .leet-meta-cache.json docs/data.json .leet-notified.json
          if git diff --cached --quiet; then
            echo "Nothing changed, skipping commit."
          else
            git commit -m "docs: auto-update README stats [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build-readme
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

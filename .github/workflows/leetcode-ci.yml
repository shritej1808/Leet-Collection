name: LeetCode CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  compile:
    name: Compile Java Solutions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile each solution independently
        shell: bash
        run: |
          set -e

          count=0

          while IFS= read -r -d '' file; do
            echo "========================================"
            echo "Compiling: $file"
            echo "========================================"

            javac "$file"

            echo "✓ Passed: $file"
            count=$((count + 1))
          done < <(find . -name "*.java" -print0)

          echo "========================================"
          echo "✓ $count solution(s) compiled successfully"
          echo "========================================"